server:
  port: 8080

spring:
  application:
    name: demo

  # 저장소 루트 compose.yaml 의 PostgreSQL. `npm run dev` 가 컨테이너를 새로 만들어 매번 빈 DB로 시작한다.
  # API만 따로 실행할 때는 먼저 루트에서 `npm run db:up` 을 실행한다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/auction}
    username: ${DB_USERNAME:auction}
    password: ${DB_PASSWORD:auction}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# http://localhost:8080/swagger-ui.html 에서 API를 보고 직접 호출해 볼 수 있다.
# 스펙 원본(JSON)은 http://localhost:8080/v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    org.hibernate.SQL: DEBUG

# 브라우저에서 직접 접근할 웹 원점만 허용한다. 여러 원점은 쉼표로 구분한다.
auction:
  web:
    allowed-origins: ${AUCTION_WEB_ALLOWED_ORIGINS:http://localhost:3000}
  events:
    heartbeat-ms: ${AUCTION_EVENTS_HEARTBEAT_MS:15000}
    timeout-ms: ${AUCTION_EVENTS_TIMEOUT_MS:1800000}
